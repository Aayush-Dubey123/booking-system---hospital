[project]
name = "hospitalcare-cli"
version = "1.0.0"
description = "HospitalCare CLI — terminal frontend for CityCare Clinic"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "httpx>=0.28",
]

[project.scripts]
hospitalcare = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]
